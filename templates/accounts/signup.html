{% extends 'base.html' %}

{% block title %}Регистрация | {{ SHOP_NAME }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="h3 mb-3">Регистрация</h1>
        <form method="post" class="card card-body shadow-sm">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-dark" type="submit">Создать аккаунт</button>
        </form>
    </div>
</div>
{% endblock %}
