{% extends 'base.html' %}

{% block title %}Каталог | {{ SHOP_NAME }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h1 class="h3 mb-0">Каталог товаров</h1>
    <div class="btn-group">
        <a class="btn btn-sm btn-outline-dark"
            href="{% url 'core:set_view_mode' 'grid' %}?next={{ request.get_full_path }}">Сетка</a>
        <a class="btn btn-sm btn-outline-dark"
            href="{% url 'core:set_view_mode' 'list' %}?next={{ request.get_full_path }}">Список</a>
    </div>
</div>

<form id="catalog-filters" class="row g-2 mb-4" action="{% url 'catalog:product_list' %}" method="get">
    <div class="col-md-5">
        <input class="form-control" type="text" name="q" value="{{ q }}" placeholder="Поиск по названию или описанию"
            hx-get="{% url 'catalog:product_list' %}" hx-target="#products-block" hx-include="#catalog-filters"
            hx-push-url="true" hx-trigger="keyup changed delay:350ms, search">
    </div>
    <div class="col-md-3">
        <select class="form-select" name="category" hx-get="{% url 'catalog:product_list' %}"
            hx-target="#products-block" hx-include="#catalog-filters" hx-push-url="true" hx-trigger="change">
            <option value="">Все категории</option>
            {% for category in category_options %}
            <option value="{{ category.slug }}" {{ category.selected_attr }}>
                {{ category.name }}
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-4">
        <select class="form-select" name="sort" hx-get="{% url 'catalog:product_list' %}" hx-target="#products-block"
            hx-include="#catalog-filters" hx-push-url="true" hx-trigger="change">
            {% for option in sort_options %}
            <option value="{{ option.value }}" {{ option.selected_attr }}>{{ option.label }}</option>
            {% endfor %}
        </select>
    </div>
</form>

<div id="products-block">
    {% include 'catalog/partials/product_list_block.html' %}
</div>
{% endblock %}
